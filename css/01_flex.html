<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: sans-serif; padding: 20px; }
  
  .container {
    display: flex;;
    gap: 10px;
    
    border: 2px solid #333;
    padding: 10px;
    height: 200px;
    background: #f0f0f0;
  }
  
  .item {
    background: #4CAF50;
    color: white;
    padding: 20px;
    font-size: 18px;


  }
  
  .item:nth-child(2) { background: #2196F3; }
  .item:nth-child(3) { background: #FF9800; }
</style>
</head>
<body>

  <h2>Меняй свойства .container в CSS</h2>
  
  <div class="container">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
  </div>

</body>
</html>
