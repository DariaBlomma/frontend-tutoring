<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS flex alignment examples</title>
    <style>
        .square {
            width: 300px;
            height: 300px;
            border: 1px solid black;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="square">
        <span>Horizontal</span><span>Vertical</span>
    </div>
</body>
</html>
